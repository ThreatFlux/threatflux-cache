name: Feature request
description: Propose a focused enhancement to threatflux-cache.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What cache use case is difficult or impossible today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the API and behavior you would like.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What workarounds or alternative designs have you evaluated?

  - type: checkboxes
    id: compatibility
    attributes:
      label: Compatibility considerations
      options:
        - label: This may change the public API.
        - label: This may change persisted cache compatibility.
        - label: This may require a new optional dependency or feature.

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add examples, measurements, or links that help evaluate the request.
