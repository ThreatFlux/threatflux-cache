name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUST_STABLE: 1.97.1

jobs:
  provenance:
    name: Verify release provenance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      tag_object: ${{ steps.provenance.outputs.tag_object }}
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: ${{ env.RUST_STABLE }}

      - name: Verify release version
        id: version
        shell: bash
        run: |
          metadata="$(cargo metadata --locked --no-deps --format-version 1)"
          version="$(jq -er '.packages[] | select(.name == "threatflux-cache") | .version' <<< "$metadata")"
          test "$GITHUB_REF_NAME" = "v${version}"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Verify annotated tag is on main
        id: provenance
        shell: bash
        run: |
          tag_ref="refs/tags/${GITHUB_REF_NAME}"
          if [[ "$(git cat-file -t "$tag_ref")" != "tag" ]]; then
            echo "Release tag ${GITHUB_REF_NAME} must be annotated" >&2
            exit 1
          fi
          git fetch --no-tags origin main
          tag_commit="$(git rev-list -n 1 "$tag_ref")"
          if ! git merge-base --is-ancestor "$tag_commit" origin/main; then
            echo "Release commit $tag_commit is not reachable from origin/main" >&2
            exit 1
          fi
          echo "tag_object=$(git rev-parse "$tag_ref")" >> "$GITHUB_OUTPUT"

      - name: Verify version is unpublished
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          crate_data="$(curl --fail --silent --show-error --retry 3 \
            --user-agent "ThreatFlux-cache-release/${GITHUB_RUN_ID}" \
            https://crates.io/api/v1/crates/threatflux-cache)"
          if jq -e --arg version "$PACKAGE_VERSION" \
            '.versions | any(.num == $version)' <<< "$crate_data" >/dev/null; then
            echo "threatflux-cache $PACKAGE_VERSION is already published on crates.io" >&2
            exit 1
          fi

  verify:
    name: Verify release (${{ matrix.os }})
    needs: provenance
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: ${{ env.RUST_STABLE }}

      - name: Test release build
        run: cargo test --release --all-features --locked

  package:
    name: Package crate
    needs: [provenance, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: ${{ env.RUST_STABLE }}
          components: clippy, rustfmt

      - name: Check formatting and lints
        run: |
          cargo fmt --all -- --check
          cargo clippy --all-targets --all-features --locked -- -D warnings

      - name: Verify package contents
        run: cargo package --locked

      - name: Verify crates.io publication
        run: cargo publish --locked --dry-run

      - name: Upload crate package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: crate-package
          path: target/package/*.crate
          if-no-files-found: error

  publish:
    name: Publish to crates.io
    needs: [provenance, package]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: crates-io
      url: https://crates.io/crates/threatflux-cache
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: ${{ env.RUST_STABLE }}

      - name: Recheck immutable release tag
        env:
          EXPECTED_TAG_OBJECT: ${{ needs.provenance.outputs.tag_object }}
        shell: bash
        run: |
          tag_ref="refs/tags/${GITHUB_REF_NAME}"
          remote_tag_object="$(git ls-remote --tags origin "$tag_ref" | awk 'NR == 1 { print $1 }')"
          if [[ -z "$EXPECTED_TAG_OBJECT" || "$remote_tag_object" != "$EXPECTED_TAG_OBJECT" ]]; then
            echo "Release tag ${GITHUB_REF_NAME} changed or disappeared after verification" >&2
            exit 1
          fi

      - name: Request a crates.io trusted-publishing token
        id: crates-io
        continue-on-error: true
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: Publish crate
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io.outputs.token || secrets.CARGO_REGISTRY_TOKEN }}
        shell: bash
        run: |
          if [[ -z "$CARGO_REGISTRY_TOKEN" ]]; then
            echo "Neither crates.io trusted publishing nor the release-token fallback is configured" >&2
            exit 1
          fi
          cargo publish --locked

  github-release:
    name: Create GitHub release
    needs: [provenance, package, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Recheck immutable release tag
        env:
          EXPECTED_TAG_OBJECT: ${{ needs.provenance.outputs.tag_object }}
        shell: bash
        run: |
          tag_ref="refs/tags/${GITHUB_REF_NAME}"
          remote_tag_object="$(git ls-remote --tags origin "$tag_ref" | awk 'NR == 1 { print $1 }')"
          if [[ -z "$EXPECTED_TAG_OBJECT" || "$remote_tag_object" != "$EXPECTED_TAG_OBJECT" ]]; then
            echo "Release tag ${GITHUB_REF_NAME} changed or disappeared after publication" >&2
            exit 1
          fi

      - name: Download crate package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: crate-package
          path: dist

      - name: Create GitHub release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: dist/*.crate
          generate_release_notes: true
          name: ThreatFlux Cache ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          tag_name: ${{ github.ref_name }}
