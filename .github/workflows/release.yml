name: Release

# Read-only by default. Only the jobs that create the release tag or the GitHub
# Release request contents: write. id-token: write is limited to the crates.io
# publish job (trusted publishing) and the GitHub Release job (signing the build
# provenance attestation).
permissions:
  contents: read

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: Version to release (e.g. 0.2.1). Defaults to the Cargo.toml version of the source.
        required: false
        type: string
      prerelease:
        description: Mark the GitHub Release as a pre-release
        required: false
        type: boolean
        default: false
      dry_run:
        description: >-
          Rehearse the release: test and build every target, package the crate, generate the SBOM and run cargo publish --dry-run,
          without creating a tag or GitHub Release, attaching assets, or publishing to crates.io.
        required: false
        type: boolean
        default: false

# A rehearsal never waits behind, or cancels, a real release.
concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'release-dry-run' || 'release' }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUST_STABLE: 1.97.1
  CRATE_NAME: threatflux-cache
  # Only workflow_dispatch can set this; tag pushes always perform a real release.
  DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}
  SEMVER_PATTERN: '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'

jobs:
  prepare:
    name: Prepare release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # Creates the annotated release tag for a manual, non-dry-run dispatch.
    outputs:
      version: ${{ steps.version.outputs.version }}
      source_sha: ${{ steps.source_sha.outputs.source_sha }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      tag_object: ${{ steps.tag.outputs.tag_object }}
    steps:
      # Every job builds the commit this run was started for (the tag, or the
      # ref chosen with `gh workflow run --ref`), never a ref taken from an
      # input, so a run cannot be pointed at unreviewed code.
      - name: Check out release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve source commit
        id: source_sha
        shell: bash
        run: |
          SOURCE_SHA="$(git rev-parse --verify HEAD)"
          # Peel GITHUB_SHA in case it names an annotated tag object.
          EXPECTED_SHA="$(git rev-parse --verify "${GITHUB_SHA}^{commit}")"
          if [[ "$SOURCE_SHA" != "$EXPECTED_SHA" ]]; then
            echo "Checked out ${SOURCE_SHA}, expected ${EXPECTED_SHA}" >&2
            exit 1
          fi
          echo "source_sha=${SOURCE_SHA}" >> "$GITHUB_OUTPUT"

      - name: Determine version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          MANIFEST_VERSION="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')"
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          elif [[ -n "$INPUT_VERSION" ]]; then
            VERSION="${INPUT_VERSION#v}"
          else
            VERSION="$MANIFEST_VERSION"
          fi
          if ! [[ "$VERSION" =~ $SEMVER_PATTERN ]]; then
            echo "Invalid version format: $VERSION" >&2
            exit 1
          fi
          # The crate is published at its Cargo.toml version, so a release must
          # match it. A dry run may rehearse a version that is not bumped yet,
          # so it only warns.
          if [[ "$MANIFEST_VERSION" != "$VERSION" ]]; then
            if [[ "$DRY_RUN" == "true" ]]; then
              echo "::warning::Cargo.toml version ${MANIFEST_VERSION} does not match release version ${VERSION}; the dry run packages and verifies ${MANIFEST_VERSION}"
            else
              echo "Cargo.toml version ${MANIFEST_VERSION} does not match release version ${VERSION}" >&2
              exit 1
            fi
          fi
          PRERELEASE=false
          if [[ "$VERSION" == *-* ]]; then
            PRERELEASE=true
          fi
          {
            echo "version=$VERSION"
            echo "manifest_version=$MANIFEST_VERSION"
            echo "prerelease=$PRERELEASE"
          } >> "$GITHUB_OUTPUT"

      # A real release must come from a commit that is already on main, so
      # nothing unreviewed can be tagged or published.
      - name: Require a source in main history
        if: env.DRY_RUN != 'true'
        env:
          SOURCE_SHA: ${{ steps.source_sha.outputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          if ! git merge-base --is-ancestor "$SOURCE_SHA" origin/main; then
            echo "Release commit ${SOURCE_SHA} is not reachable from origin/main" >&2
            exit 1
          fi

      # An existing tag is never moved. A tag push must carry an annotated tag;
      # a manual dispatch creates one on the verified commit when it is missing.
      - name: Ensure release tag
        id: tag
        if: env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          SOURCE_SHA: ${{ steps.source_sha.outputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="v${VERSION}"
          if git show-ref --verify --quiet "refs/tags/${TAG}"; then
            if [[ "$(git cat-file -t "refs/tags/${TAG}")" != "tag" ]]; then
              echo "Release tag ${TAG} must be annotated" >&2
              exit 1
            fi
          elif [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            tag_object="$(gh api --method POST "repos/${GITHUB_REPOSITORY}/git/tags" \
              -f tag="${TAG}" -f message="Release ${TAG}" -f object="${SOURCE_SHA}" \
              -f type=commit --jq .sha)"
            # Ref creation is atomic: if a concurrent run or a manual push
            # created the tag first, this fails and the check below compares
            # against that tag.
            gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref="refs/tags/${TAG}" -f sha="${tag_object}" >/dev/null || true
          else
            echo "Missing expected release tag ${TAG}" >&2
            exit 1
          fi
          # The tag on GitHub, not the checkout snapshot, decides the release.
          # Later jobs recheck this exact tag object before they publish.
          read -r TAG_TYPE TAG_OBJECT < <(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" --jq '"\(.object.type) \(.object.sha)"')
          if [[ "$TAG_TYPE" != "tag" ]]; then
            echo "Release tag ${TAG} on GitHub must be annotated" >&2
            exit 1
          fi
          REMOTE_TAG_SHA="$(gh api "repos/${GITHUB_REPOSITORY}/commits/refs/tags/${TAG}" --jq .sha)"
          if [[ "$REMOTE_TAG_SHA" != "$SOURCE_SHA" ]]; then
            echo "Tag ${TAG} points to ${REMOTE_TAG_SHA}, not the release commit ${SOURCE_SHA}" >&2
            exit 1
          fi
          echo "tag_object=${TAG_OBJECT}" >> "$GITHUB_OUTPUT"

      - name: Dry run summary
        if: env.DRY_RUN == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          MANIFEST_VERSION: ${{ steps.version.outputs.manifest_version }}
          SOURCE_SHA: ${{ steps.source_sha.outputs.source_sha }}
        shell: bash
        run: |
          {
            echo "### Release dry run: v${VERSION}"
            echo
            echo "Source commit: \`${SOURCE_SHA}\`. No tag, GitHub Release, release asset, or crates.io package is published."
            echo
            echo "Cargo.toml version packaged and verified: \`${MANIFEST_VERSION}\`."
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Test and build (${{ matrix.target }})
    needs: prepare
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - name: Check out release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: ${{ env.RUST_STABLE }}
          targets: ${{ matrix.target }}

      - name: Build release library
        run: cargo build --release --locked --all-features --target ${{ matrix.target }}

      - name: Build release library without default features
        run: cargo build --release --locked --no-default-features --target ${{ matrix.target }}

      - name: Test release build
        run: cargo test --release --locked --all-features --target ${{ matrix.target }}

  package:
    name: Package crate
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: ${{ env.RUST_STABLE }}
          components: clippy, rustfmt

      - name: Check formatting and lints
        run: |
          cargo fmt --all -- --check
          cargo clippy --all-targets --all-features --locked -- -D warnings

      - name: Verify package contents
        run: |
          cargo package --locked --list
          cargo package --locked

      - name: Write crate checksum
        shell: bash
        run: |
          set -euo pipefail
          cd target/package
          for crate in ./*.crate; do
            sha256sum "${crate#./}" > "${crate#./}.sha256"
          done

      - name: Upload crate package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-crate
          path: |
            target/package/*.crate
            target/package/*.crate.sha256
          if-no-files-found: error
          retention-days: 5

  sbom:
    name: Generate release SBOM
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: ${{ env.RUST_STABLE }}

      - name: Install cargo-cyclonedx
        uses: taiki-e/install-action@d438492cf8a250514fa2d34b30bc3c0dc37c65ff # v2.87.8
        with:
          tool: cargo-cyclonedx@0.5.9

      - name: Generate SBOM
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          make sbom
          sbom="${CRATE_NAME}-v${VERSION}.cdx.json"
          mv "sbom/${CRATE_NAME}-sbom.json" "sbom/${sbom}"
          jq -e '.bomFormat == "CycloneDX" and (.components | length > 0)' "sbom/${sbom}" >/dev/null
          (cd sbom && sha256sum "$sbom" > "${sbom}.sha256")

      - name: Upload SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-sbom
          path: |
            sbom/*.cdx.json
            sbom/*.cdx.json.sha256
          if-no-files-found: error
          retention-days: 5

  publish:
    name: Publish to crates.io
    needs: [prepare, build, package, sbom]
    # Real releases never publish a pre-release version; a dry run always runs
    # cargo publish --dry-run.
    if: github.event_name == 'workflow_dispatch' && inputs.dry_run || needs.prepare.outputs.prerelease != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # crates.io trusted publishing trusts this workflow file (release.yml) in the
    # crates-io environment. A dry run gets an empty environment name, which
    # runs the job without an environment, so it records no deployment.
    environment:
      name: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) && 'crates-io' || '' }}
    permissions:
      contents: read
      id-token: write # Exchanged for a short-lived crates.io token; no registry secret is used.
    steps:
      - name: Check out release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: ${{ env.RUST_STABLE }}

      - name: Verify crates.io package (dry run)
        if: env.DRY_RUN == 'true'
        run: cargo publish --locked --all-features --dry-run

      # crates.io versions are immutable, so a rerun (or a second run for the
      # same tag) skips a version that is already published instead of failing.
      - name: Check whether the version is already published
        id: pending
        if: env.DRY_RUN != 'true'
        shell: bash
        run: |
          set -euo pipefail
          version="$(cargo metadata --locked --no-deps --format-version 1 \
            | jq -er --arg name "$CRATE_NAME" '.packages[] | select(.name == $name) | .version')"
          status="$(curl --silent --show-error --retry 3 --retry-all-errors \
            --user-agent "${GITHUB_REPOSITORY}-release/${GITHUB_RUN_ID} (https://github.com/${GITHUB_REPOSITORY})" \
            --output /dev/null --write-out '%{http_code}' \
            "https://crates.io/api/v1/crates/${CRATE_NAME}/${version}")"
          case "$status" in
            200)
              echo "::notice::${CRATE_NAME} ${version} is already on crates.io; skipping publish"
              echo "publish=false" >> "$GITHUB_OUTPUT"
              ;;
            404) echo "publish=true" >> "$GITHUB_OUTPUT" ;;
            *)
              echo "crates.io returned HTTP ${status} for ${CRATE_NAME} ${version}" >&2
              exit 1
              ;;
          esac

      # crates.io versions are irreversible, so make sure the tag was neither
      # moved nor deleted since prepare verified it.
      - name: Recheck release tag
        if: env.DRY_RUN != 'true' && steps.pending.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
          EXPECTED_TAG_OBJECT: ${{ needs.prepare.outputs.tag_object }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="v${VERSION}"
          REMOTE_TAG_OBJECT="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" --jq .object.sha)"
          if [[ -z "$EXPECTED_TAG_OBJECT" || "$REMOTE_TAG_OBJECT" != "$EXPECTED_TAG_OBJECT" ]]; then
            echo "Release tag ${TAG} changed or disappeared after it was verified" >&2
            exit 1
          fi

      - name: Authenticate with crates.io
        id: crates-io-auth
        if: env.DRY_RUN != 'true' && steps.pending.outputs.publish == 'true'
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: Publish to crates.io
        if: env.DRY_RUN != 'true' && steps.pending.outputs.publish == 'true'
        env:
          # Short-lived trusted-publishing token; the auth action revokes it in
          # its post step. No long-lived registry secret is read.
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io-auth.outputs.token }}
        run: cargo publish --locked --all-features

  github-release:
    name: Publish GitHub Release
    needs: [prepare, build, package, sbom, publish]
    # Runs after a successful publish, or after publish was skipped for a
    # pre-release version; never for a dry run.
    if: >-
      !cancelled() && !(github.event_name == 'workflow_dispatch' && inputs.dry_run) &&
      needs.build.result == 'success' && needs.package.result == 'success' && needs.sbom.result == 'success' &&
      (needs.publish.result == 'success' || (needs.publish.result == 'skipped' && needs.prepare.outputs.prerelease == 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      attestations: write # Stores the build provenance attestation.
      contents: write # Creates or updates the GitHub Release and uploads its assets.
      id-token: write # Signs the build provenance attestation with GitHub OIDC.
    steps:
      - name: Check out release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          pattern: release-*
          merge-multiple: true

      - name: Verify asset checksums
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          for asset in "${CRATE_NAME}-${VERSION}.crate" "${CRATE_NAME}-v${VERSION}.cdx.json"; do
            if [[ ! -f "$asset" || ! -f "${asset}.sha256" ]]; then
              echo "Missing release asset ${asset} or its checksum" >&2
              exit 1
            fi
          done
          sha256sum --check --strict ./*.sha256

      # The attached .crate must be byte-for-byte the package crates.io serves,
      # so its checksum file also verifies a crate downloaded from crates.io.
      - name: Match the crate published to crates.io
        if: needs.publish.result == 'success'
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          crate="dist/${CRATE_NAME}-${VERSION}.crate"
          local_sha256="$(sha256sum "$crate" | awk '{ print $1 }')"
          published_sha256="$(curl --fail --silent --show-error --retry 5 --retry-all-errors \
            --user-agent "${GITHUB_REPOSITORY}-release/${GITHUB_RUN_ID} (https://github.com/${GITHUB_REPOSITORY})" \
            "https://crates.io/api/v1/crates/${CRATE_NAME}/${VERSION}" | jq -er '.version.checksum')"
          if [[ "$published_sha256" != "$local_sha256" ]]; then
            echo "${crate} (sha256 ${local_sha256}) differs from the crates.io package (sha256 ${published_sha256})" >&2
            exit 1
          fi
          echo "${crate} matches crates.io (sha256 ${published_sha256})"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.crate
            dist/*.cdx.json

      - name: Generate release notes
        id: notes
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          section="$(awk -v heading="## [${VERSION}]" 'index($0, heading) == 1 { found = 1; next } found && /^## \[/ { exit } found { print }' CHANGELOG.md)"
          if [[ -n "${section//[[:space:]]/}" ]]; then
            printf '%s\n' "$section" > release_notes.md
            echo "has_changelog=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changelog=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
          EXPECTED_TAG_OBJECT: ${{ needs.prepare.outputs.tag_object }}
          HAS_CHANGELOG: ${{ steps.notes.outputs.has_changelog }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease == 'true' || (github.event_name == 'workflow_dispatch' && inputs.prerelease) }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="v${VERSION}"
          TITLE="ThreatFlux Cache ${TAG}"
          # The tag must still be the one that was verified, tested and published.
          REMOTE_TAG_OBJECT="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" --jq .object.sha)"
          REMOTE_TAG_SHA="$(gh api "repos/${GITHUB_REPOSITORY}/commits/refs/tags/${TAG}" --jq .sha)"
          if [[ -z "$EXPECTED_TAG_OBJECT" || "$REMOTE_TAG_OBJECT" != "$EXPECTED_TAG_OBJECT" || "$REMOTE_TAG_SHA" != "$SOURCE_SHA" ]]; then
            echo "Release tag ${TAG} changed or disappeared after it was verified" >&2
            exit 1
          fi
          # Auto Release already publishes the Release with notes generated
          # from the conventional commits; only replace them with a curated
          # changelog section when one exists.
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            if [[ "$HAS_CHANGELOG" == "true" ]]; then
              gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TITLE" --notes-file release_notes.md
            fi
          else
            args=(--repo "$GITHUB_REPOSITORY" --verify-tag --title "$TITLE")
            if [[ "$HAS_CHANGELOG" == "true" ]]; then
              args+=(--notes-file release_notes.md)
            else
              args+=(--generate-notes)
            fi
            if [[ "$PRERELEASE" == "true" ]]; then
              args+=(--prerelease)
            fi
            gh release create "$TAG" "${args[@]}"
          fi
          gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
