[workspace]
resolver = "3"

[package]
name = "threatflux-cache"
version = "0.2.0"
edition = "2024"
rust-version = "1.95.0"
authors = ["ThreatFlux"]
description = "A bounded async cache library with in-memory and filesystem backends"
license = "MIT"
repository = "https://github.com/ThreatFlux/threatflux-cache"
homepage = "https://github.com/ThreatFlux/threatflux-cache"
documentation = "https://docs.rs/threatflux-cache"
readme = "README.md"
keywords = ["cache", "async", "storage", "lru", "persistence"]
categories = ["caching", "asynchronous", "data-structures"]
include = [
    "/src/**",
    "/examples/**",
    "/tests/**",
    "/docs/**",
    "/*.md",
    "/Cargo.lock",
    "/LICENSE",
]

[dependencies]
tokio = { version = "1.45", default-features = false, features = ["sync"] }
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
thiserror = "2.0"
serde_json = { version = "1.0", optional = true }

[dev-dependencies]
tokio = { version = "1.45", default-features = false, features = ["macros", "rt-multi-thread"] }
tempfile = "3.16"

[features]
default = ["filesystem-backend"]
filesystem-backend = ["dep:serde_json", "tokio/fs", "tokio/io-util"]
full = ["filesystem-backend"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints.rust]
unsafe_code = "forbid"

[[example]]
name = "basic_usage"

[[example]]
name = "custom_entry"

[[example]]
name = "file_scanner_migration"
required-features = ["filesystem-backend"]
